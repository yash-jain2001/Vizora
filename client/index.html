<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO Meta Tags -->
    <title>Vizora — Real-Time IoT Monitoring & Analytics Dashboard</title>
    <meta name="description" content="Vizora is a powerful IoT monitoring platform with real-time dashboards, sensor analytics, MQTT integration, and customizable alerts for industrial and smart-device ecosystems." />
    <meta name="keywords" content="IoT dashboard, IoT monitoring platform, real-time sensor analytics, MQTT dashboard, IoT data visualization, Grafana alternative, industrial IoT" />
    <meta name="author" content="Vizora" />
    <meta name="robots" content="index, follow" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://vizora.app/" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#10b981" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://vizora.app/" />
    <meta property="og:title" content="Vizora — Real-Time IoT Monitoring & Analytics Dashboard" />
    <meta property="og:description" content="Monitor IoT devices in real time with Vizora. Build custom dashboards, visualize sensor data, configure MQTT sources, and set intelligent alerts — all from one unified platform." />
    <meta property="og:site_name" content="Vizora" />
    <meta property="og:image" content="https://vizora.app/logo.jpeg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:image" content="https://vizora.app/logo.jpeg" />

    <!-- JSON-LD Structured Data: SoftwareApplication -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Vizora",
        "description": "Vizora is a real-time IoT monitoring and analytics dashboard that lets you visualize sensor data, manage MQTT data sources, and configure intelligent alerts for industrial and smart-device ecosystems.",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "url": "https://vizora.app/",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>

    <!-- JSON-LD Structured Data: Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Vizora",
        "url": "https://vizora.app/",
        "logo": "https://vizora.app/logo.jpeg"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>

    <!-- Fallback content for crawlers and users without JavaScript -->
    <noscript>
      <h1>Vizora — Real-Time IoT Monitoring & Analytics Dashboard</h1>

        Vizora is a powerful, open-source IoT monitoring platform designed for

        sources, build fully customizable dashboards with live-updating charts,
        and configure intelligent alerts to stay on top of your industrial IoT
        and smart-device ecosystems. Vizora is a modern, lightweight alternative
        to Grafana — purpose-built for IoT workloads.
      </p>
      <p>
        <a href="https://vizora.app/login">Sign In</a> |
